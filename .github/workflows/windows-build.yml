name: Windows EXE build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Verify speech dependency compatibility
        shell: pwsh
        run: |
          @'
          import av
          from importlib.metadata import version
          assert int(version("av").split(".")[0]) < 19, version("av")
          print("PyAV compatible:", version("av"))
          '@ | python -
      - name: Tests
        run: python -m pytest -q
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --name AURA --paths . --collect-data faster_whisper --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtHelp --exclude-module PySide6.QtNetworkAuth --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets --exclude-module PySide6.QtPositioning --exclude-module PySide6.QtSensors --exclude-module PySide6.QtSerialPort --exclude-module PySide6.QtSql --exclude-module PySide6.QtSvgWidgets --exclude-module PySide6.QtTest --exclude-module PySide6.QtTextToSpeech --exclude-module PySide6.QtWebSockets --exclude-module PySide6.QtXml --exclude-module playwright aura/__main__.py
      - name: Verify packaged voice assets
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows
          path: dist/AURA/*
          if-no-files-found: error
          retention-days: 14
