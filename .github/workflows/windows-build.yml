name: Windows EXE build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m playwright install chromium
      - name: Tests
        run: python -m pytest -q
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --windowed --name AURA --collect-all PySide6 --collect-all faster_whisper --collect-all sounddevice --collect-all keyring --collect-all anthropic --collect-all playwright --paths . aura/__main__.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AURA/AURA.exe")) { throw "AURA.exe missing" }
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/AURA/* -DestinationPath AURA-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows
          path: AURA-Windows.zip
          retention-days: 14
